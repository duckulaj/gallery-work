<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body hx-boost="true" th:attr="data-initial-panel=${initialPanel}">
  <div class="shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main id="gallery-main" th:replace="~{fragments/workspace :: workspace}"></main>
    <section id="preview"></section>
    <aside id="ai-panel" class="ai-panel ai-panel--hidden"></aside>
  </div>
  <div id="toast" class="toast-message" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
