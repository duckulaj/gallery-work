<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensitive content review</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-dark text-light">
<div class="container-fluid py-3">
  <div class="d-flex align-items-center gap-3 mb-3">
    <a href="/" class="btn btn-outline-light">← Gallery</a>
    <h1 class="h3 mb-0">Sensitive content review</h1>
    <form class="ms-auto d-flex gap-2">
      <select name="status" class="form-select">
        <option value="UNREVIEWED" th:selected="${status == 'UNREVIEWED'}">UNREVIEWED</option>
        <option value="KEEP" th:selected="${status == 'KEEP'}">KEEP</option>
        <option value="FLAGGED" th:selected="${status == 'FLAGGED'}">FLAGGED</option>
        <option value="QUARANTINED" th:selected="${status == 'QUARANTINED'}">QUARANTINED</option>
        <option value="ALL" th:selected="${status == 'ALL'}">ALL</option>
      </select>
      <input type="number" min="0" max="1" step="0.05" name="threshold" class="form-control" th:value="${threshold}">
      <button class="btn btn-primary">Apply</button>
    </form>
  </div>
  <div class="alert alert-warning">AI results can be wrong. Review every image. Quarantine moves the local original; it does not delete Google Photos.</div>
  <div class="row g-3">
    <div class="col-6 col-md-4 col-lg-3 col-xl-2" th:each="asset : ${assets}">
      <div class="card bg-secondary text-light h-100">
        <img class="card-img-top" loading="lazy" th:src="@{/thumbs/{id}(id=${asset.id})}" th:alt="${asset.filename}">
        <div class="card-body p-2">
          <div class="small text-truncate" th:text="${asset.filename}"></div>
          <strong th:text="${#numbers.formatPercent(metas[asset.id].nsfwScore,1,0)}"></strong>
          <span class="badge bg-danger" th:text="${metas[asset.id].nsfwLevel}"></span>
          <div class="d-grid gap-1 mt-2">
            <form th:action="@{/review/sensitive/{id}/status(id=${asset.id})}" method="post"><input type="hidden" name="threshold" th:value="${threshold}"><button name="value" value="KEEP" class="btn btn-sm btn-success w-100">Keep</button></form>
            <form th:action="@{/review/sensitive/{id}/status(id=${asset.id})}" method="post"><input type="hidden" name="threshold" th:value="${threshold}"><button name="value" value="FLAGGED" class="btn btn-sm btn-warning w-100">Flag</button></form>
            <form th:action="@{/review/sensitive/{id}/quarantine(id=${asset.id})}" method="post" onsubmit="return confirm('Move this local file to quarantine?')"><input type="hidden" name="threshold" th:value="${threshold}"><button class="btn btn-sm btn-danger w-100">Quarantine</button></form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
