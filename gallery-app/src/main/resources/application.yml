spring:
  datasource:
    url: ${GALLERY_DB_URL:jdbc:postgresql://localhost:5432/gallery_ai}
    username: ${GALLERY_DB_USERNAME:gallery_user}
    password: ${GALLERY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    validate-on-migrate: false
  thymeleaf:
    cache: true
  cache:
    type: caffeine
    cache-names: query-expansions,embeddings
    caffeine:
      spec: recordStats,maximumSize=1000,expireAfterAccess=2h
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB
  ai:
    retry:
      max-attempts: 1
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: gemma3:4b
        temperature: 0.2
      embedding:
        model: mxbai-embed-large
app:
  security:
    admin-username: ${GALLERY_ADMIN_USERNAME:gallery}
    admin-password: ${GALLERY_ADMIN_PASSWORD:}
  storage-root: ${GALLERY_DATA_ROOT:${user.home}/Gallery-App/data}/gallery
  import-roots:
    - ${GALLERY_IMPORT_ROOT:${user.home}}
    - ${GALLERY_MOUNT_ROOT:/mnt}
  thumbnail-size: 420
  semantic-candidate-limit: 5000
  ai:
    background:
      enabled: true
      max-in-flight: 6
      fixed-delay-ms: 4000
      worker-threads: 6
      embedding-threads: 4
      connection-pool-size: 8
      ai-resize-cache-entries: 512
    vision:
      enabled: true
      model: minicpm-v4.6
      temperature: 0.0
      num-predict: 512
      resize-size: 768
      num-ctx: 4096
      top-k: 40
      top-p: 0.9
      repeat-penalty: 1.1
      num-batch: 512
      keep-alive: 10m
    face-recognition:
      enabled: true
      service-url: ${FACE_SERVICE_URL:http://localhost:8082}
      threshold: 0.40
      fixed-delay-ms: 250
      batch-size: 16
      worker-threads: 4
      face-crops-dir: ${GALLERY_DATA_ROOT:${user.home}/Gallery-App/data}/gallery/face-crops
    nsfw:
      enabled: true
      fixed-delay-ms: 250
      batch-size: 16
      worker-threads: 4
      service-url: ${NSFW_SERVICE_URL:http://localhost:8082}
      review-threshold: 0.20
      explicit-threshold: 0.55
      quarantine-dir: ${GALLERY_DATA_ROOT:${user.home}/Gallery-App/data}/gallery-quarantine
  review:
    quarantine-root: ${GALLERY_DATA_ROOT:${user.home}/Gallery-App/data}/gallery/quarantine
server:
  address: ${GALLERY_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: gallery-app
---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
