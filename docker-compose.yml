services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gallery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gallery_ai}
      POSTGRES_USER: ${POSTGRES_USER:-gallery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ja9juja9ju}
    ports:
      - "5432:5432"
    volumes:
      - gallery-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gallery_user} -d ${POSTGRES_DB:-gallery_ai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  face-service:
    build:
      context: ./face-service
    container_name: gallery-face-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DEEPFACE_MODEL: ArcFace
      DEEPFACE_DETECTOR: retinaface
      DEEPFACE_MIN_CONFIDENCE: "0.5"
    volumes:
      - deepface-weights:/root/.deepface
      - ./data/gallery/face-crops:/data/gallery/face-crops
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  gallery-postgres-data:
  deepface-weights:
